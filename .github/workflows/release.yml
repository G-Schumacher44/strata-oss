name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Job ordering is load-bearing (PR #18, Codex P1): the GitHub Release is created LAST,
# only after PyPI publish succeeds. The .mcpb bundle's shim resolves `strata-lookml`
# from PyPI at launch — a Release attached before (or without) a successful publish
# hands users a bundle that cannot start. If publish-pypi fails, no Release appears
# and the tag can be deleted + re-pushed after the fix; nothing public is left behind.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Fail closed BEFORE anything is built or published if the tag disagrees with any
      # of the duplicated version fields (PR #18, Codex P2): pyproject.toml,
      # mcpb/manifest.json, the mcpb shim's exact pin, and server.json (top-level and every
      # packages[].version; the MCP registry reads it). A v0.1.7 tag pushed after a
      # missed bump would otherwise publish the WRONG immutable version to PyPI.
      - name: Verify tag matches all version fields
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$TAG_VERSION" <<'PY'
          import json, sys, tomllib, re
          tag = sys.argv[1]
          errors = []
          pyproject = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if pyproject != tag:
              errors.append(f"pyproject.toml version {pyproject!r} != tag {tag!r}")
          manifest = json.load(open("mcpb/manifest.json"))["version"]
          if manifest != tag:
              errors.append(f"mcpb/manifest.json version {manifest!r} != tag {tag!r}")
          mcpb_deps = tomllib.load(open("mcpb/pyproject.toml", "rb"))["project"]["dependencies"]
          pin = next((d for d in mcpb_deps if d.startswith("strata-lookml")), "")
          if pin != f"strata-lookml=={tag}":
              errors.append(f"mcpb shim pin {pin!r} != 'strata-lookml=={tag}'")
          server = json.load(open("server.json"))
          if server.get("version") != tag:
              errors.append(f"server.json version {server.get('version')!r} != tag {tag!r}")
          packages = server.get("packages") or []
          if not packages:
              errors.append("server.json has no packages entry")
          for i, pkg in enumerate(packages):
              if pkg.get("version") != tag:
                  errors.append(f"server.json packages[{i}].version {pkg.get('version')!r} != tag {tag!r}")
          if errors:
              print("VERSION MISMATCH — refusing to publish:")
              for e in errors: print(f"  - {e}")
              sys.exit(1)
          print(f"tag v{tag} matches pyproject, manifest, shim pin, and server.json")
          PY

      - name: Install hatchling
        run: pip install hatchling

      - name: Build wheel and sdist
        run: python -m hatchling build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Build MCP Bundle (.mcpb)
        run: |
          mcpb validate mcpb/manifest.json
          mcpb pack mcpb strata-lookml.mcpb

      - name: Upload mcpb artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: strata-lookml.mcpb

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/strata-lookml
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC) — no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # NOTE (operator prerequisite): this job authenticates via PyPI Trusted
      # Publishing (OIDC) — no API token is stored in this repo. Before the
      # first tag push, configure a Trusted Publisher on pypi.org for project
      # `strata-lookml`, owner `G-Schumacher44`, repo `strata-oss`, workflow
      # `release.yml`, environment `pypi`. Until that's configured, this job
      # fails closed with an OIDC/"not a trusted publisher" error — that is
      # expected, not a bug, and no secret can work around it.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Only after PyPI publish succeeds (see the ordering note at the top).
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: mcpb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            strata-lookml.mcpb
          generate_release_notes: true

  # Publishes server.json to the official MCP Registry via GitHub Actions OIDC (no stored
  # token, no manual `mcp-publisher login`). Pattern follows the registry docs:
  # https://github.com/modelcontextprotocol/registry/blob/main/docs/modelcontextprotocol-io/github-actions.mdx
  # Runs after publish-pypi because the registry validates the live PyPI package's README
  # for the `mcp-name: io.github.G-Schumacher44/strata-oss` token. Independent of the
  # GitHub Release job; it deliberately has no write permissions.
  publish-mcp-registry:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC login to the MCP Registry
      contents: read
    env:
      # Pinned release; bump deliberately. Never use releases/latest.
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v4

      # The registry fetches the PyPI package to validate it, so wait (bounded) until the
      # exact version is visible on PyPI. Fail closed if it never appears.
      - name: Wait for the version to be live on PyPI
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          url="https://pypi.org/pypi/strata-lookml/${VERSION}/json"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null "$url"; then
              echo "strata-lookml ${VERSION} is live on PyPI (attempt ${attempt})"
              exit 0
            fi
            echo "attempt ${attempt}/30: ${VERSION} not on PyPI yet; retrying in 10s"
            sleep 10
          done
          echo "strata-lookml ${VERSION} did not appear on PyPI within ~5 minutes; refusing to publish to the registry"
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      # Publishes the committed server.json; the version guard in `build` already proved
      # it matches the tag.
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

  # HISTORY: a `sync-to-oss` job lived here until 2026-08-16. It was bootstrap-era
  # private->public mirror automation that, after this repo BECAME the canonical one,
  # SELF-TARGETED: it added this very repo as remote 'public', git-rm'd every
  # .publicignore path (including conductor/ docs), and pushed the result onto our
  # own main — armed on the same v*.*.* trigger as the release itself. Removed with
  # PR #18; the mirror model was retired (private strata#50). Do not restore it.

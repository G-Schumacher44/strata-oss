{% extends "_layout.html" %}
{% block content %}
<h1>{{ heading }}</h1>
<p>{{ summary }}</p>
{% if facts %}<dl>
{% for term, value in facts %}<dt>{{ term }}</dt><dd>{{ value }}</dd>
{% endfor %}</dl>
{% endif %}
{% if links %}<ul>
{% for href, text in links %}<li><a href="{{ href }}">{{ text }}</a></li>
{% endfor %}</ul>
{% endif %}
{% endblock %}

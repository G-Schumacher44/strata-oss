[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strata-lookml"
version = "0.1.8"
requires-python = ">=3.11"
description = "Agentic BI toolkit for Looker and BigQuery — MCP server, LookML governance analysis, and BI engineering skills"
license = {text = "Apache-2.0"}
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
authors = [{name = "Garrett Schumacher", email = "me@garrettschumacher.com"}]
dependencies = [
  "networkx>=3.0",
  # 2.x migration landed (server.py uses mcp.server.mcpserver.MCPServer). Upper bound stays
  # as policy: a major-version resolver surprise is exactly what broke fresh installs once
  # (PR #18's dead-on-arrival strata-mcp under an unbounded pin) — lift <3 only with a 3.x
  # migration, never by widening.
  "mcp>=2,<3",
  "click>=8.0",
  "pyyaml>=6.0",
  "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov",
  "ruff>=0.4",
  "mypy>=1.10",
  "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM108", "E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = false

[tool.hatch.build.targets.wheel]
packages = ["src/strata"]
include = ["src/strata/skills/**", "src/strata/viz/charts/**", "src/strata/bootstrap/templates/**", "src/strata/assets/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.urls]
Homepage = "https://github.com/G-Schumacher44/strata-oss"
Repository = "https://github.com/G-Schumacher44/strata-oss"
Issues = "https://github.com/G-Schumacher44/strata-oss/issues"

[project.scripts]
strata       = "strata.cli.main:strata_cli"
strata-mcp   = "strata.mcp.server:main"
strata-chart = "strata.viz.render:main"

[tool.hatch.envs.default]
python = "3.11"

[tool.hatch.build.targets.sdist]
# Lean sdist: the default include-everything shipped 317 files / 6.8MB of test
# playgrounds, conductor docs, and CI config (caught in the PR #18 review panel).
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]
